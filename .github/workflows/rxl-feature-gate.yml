name: RXL Feature Gate

on:
  push:
    branches:
      - feature/rxl-site-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        continue-on-error: true
        run: npm run lint
      - name: Typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Analytics tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/analytics.test.ts
      - name: Catalog browser tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/catalog-browser.test.tsx
      - name: Catalog tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/catalog.test.ts
      - name: Configurator tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/configurator-reducer.test.ts
      - name: Contact tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/contact-form.test.tsx
      - name: Content tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/content-provider.test.ts
      - name: Home design tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/home-design.test.tsx
      - name: Integration boundary tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/integration-boundaries.test.tsx
      - name: Jobs tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/jobs-provider.test.ts
      - name: Product page tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/product-page.test.tsx
      - name: Quote payload tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/quote-payload.test.ts
      - name: Route regression tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/route-regression.test.ts
      - name: SEO tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/seo.test.ts
      - name: Shell tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/shell.test.tsx
      - name: Site tests
        continue-on-error: true
        run: npx cross-env NODE_ENV=test vitest run tests/rxl/site.test.ts
      - name: Next build
        continue-on-error: true
        run: npx next build
      - name: Full suite marker
        run: npm run test
