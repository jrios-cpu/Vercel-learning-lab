name: RXL Feature Gate

on:
  push:
    branches:
      - feature/rxl-site-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        continue-on-error: true
        run: npm run lint
      - name: Typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Tests
        continue-on-error: true
        run: npm run test
      - name: Next build
        continue-on-error: true
        run: npx next build
      - name: Enforce gate
        run: npm run lint && npm run typecheck && npm run test && npx next build
